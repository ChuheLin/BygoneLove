        const target = document.getElementById("typewriter-text");
        let index = 0;
        
        function type() {
            if (index < text.length) {
                if (text[index] === '\n') {
                    target.innerHTML += '<br>';  // 如果遇到换行符 '\n'，则插入 <br> 标签
                } else {
                    target.innerHTML += text[index];  // 否则显示字符
                }
                index++;
                setTimeout(type, 100);  // 每100ms显示下一个字符
            }
        }

        type();

        // 正计时功能
        function updateTimer() {
            const startTime = new Date("2016-12-24T19:00:00Z"); // 设定起始时间
            const now = new Date();
            const elapsed = now - startTime; // 计算已过时间

            const days = Math.floor(elapsed / (1000 * 60 * 60 * 24));
            const hours = Math.floor((elapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);

            document.getElementById("timer").textContent = 
                `${days} days ${hours} hours ${minutes} minutes ${seconds} seconds`;

            setTimeout(updateTimer, 1000); // 每秒更新
        }

        updateTimer(); // 初始化计时器
    });
</script>
