<!DOCTYPE html>

<script type="text/javascript" language="javascript">
    if (window.console && window.console.log) {  
        console.log("。");
    }  

    document.addEventListener("DOMContentLoaded", function() {
        const text = `祝你早安，午安，晚安，我今年22岁了，没能和你结婚是我一生的遗憾(2024)
(2023)
看到你似乎有了新男友，我为你感到开心，只是偶尔会有点吃醋的感觉(2022.8)
我去佛山复读了，我感觉自己实在是太糟糕了，为什么我失去了爱情，学业也如此糟糕(2021.7)
无声的思念让我痛苦，复杂的孤独令我悲伤，永不打扰是我的诺言，不过还好我可以偷偷想你(2021.1)
我不想上学，我坐不下来安静不了，还有个同学偶尔会欺负我，我很痛苦，我非常想念你(2021.1)
时间真快，去年为什么找你呢？是因为没有你我学不进去，其实初中我努力学习就是想在你面前证明我可以很优秀(2021)
我终于有勇气去找你，找完以后我也终于明白也许还是永不打扰好一些(2020.5)
困在家里我很想联系你，但我还是忍住了，我想着寒假去看医生，结果来了疫情(2020.1)
为什么你会觉得我分手后会打你，这让我很难过，我感到羞耻，我看上去可能真的很糟糕(2019.6)`;
        
        const target = document.getElementById("typewriter-text");
        let index = 0;
        
        function type() {
            if (index < text.length) {
                if (text[index] === '\n') {
                    target.innerHTML += '<br>';  // 如果遇到换行符 '\n'，则插入 <br> 标签
                } else {
                    target.innerHTML += text[index];  // 否则显示字符
                }
                index++;
                setTimeout(type, 100);  // 每100ms显示下一个字符
            }
        }

        type();

        // 正计时功能
        function updateTimer() {
            const startTime = new Date("2016-12-24T19:00:00Z"); // 设定起始时间
            const now = new Date();
            const elapsed = now - startTime; // 计算已过时间

            const days = Math.floor(elapsed / (1000 * 60 * 60 * 24));
            const hours = Math.floor((elapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);

            document.getElementById("timer").textContent = 
                `${days} days ${hours} hours ${minutes} minutes ${seconds} seconds`;

            setTimeout(updateTimer, 1000); // 每秒更新
        }

        updateTimer(); // 初始化计时器
    });
</script>
